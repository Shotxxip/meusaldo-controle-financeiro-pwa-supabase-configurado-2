<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171428">
  <title>Você está offline — MeuSaldo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f7fb;color:#201c31;font:15px Arial,sans-serif}.card{max-width:390px;text-align:center;background:#fff;border:1px solid #ecebf2;border-radius:18px;padding:34px 28px;box-shadow:0 15px 55px rgba(28,22,54,.08)}.mark{width:54px;height:54px;margin:0 auto 20px;display:grid;place-items:center;border-radius:16px;background:#704bd9;color:#fff;font-size:22px;font-weight:800}.muted{color:#858397;line-height:1.6;font-size:13px}button{margin-top:14px;border:0;border-radius:9px;background:#6d45d8;color:#fff;padding:12px 17px;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main class="card"><div class="mark">MS</div><h1>Você está sem conexão</h1><p class="muted">O MeuSaldo precisa de internet para carregar e sincronizar seus lançamentos. Verifique sua conexão e tente novamente.</p><button onclick="location.reload()">Tentar novamente</button></main></body>
</html>
